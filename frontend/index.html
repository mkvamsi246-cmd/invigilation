<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invigilation Duty System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
        <h1 class="login-title">Invigilation System</h1>
        <p class="login-sub">Sign in to continue</p>
        <label class="field-label">Username</label>
        <input type="text" id="login-username" class="input" autocomplete="username" required>
        <label class="field-label">Password</label>
        <input type="password" id="login-password" class="input" autocomplete="current-password" required>
        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">Sign In</button>
        <div id="login-status" style="font-size:12px;color:var(--gray-500);margin-top:8px;text-align:center;" class="hidden"></div>
        <p id="login-error" class="error-text"></p>
    </form>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell hidden">

    <aside class="sidebar">
        <div class="sidebar-brand">Invigilation<span>System</span></div>
        <nav class="sidebar-nav">
            <button class="nav-item active" data-view="dashboard">Dashboard</button>
            <button class="nav-item" data-view="faculty">Faculty</button>
            <button class="nav-item" data-view="classrooms">Classrooms</button>
            <button class="nav-item" data-view="exams">Exam Sessions</button>
            <button class="nav-item" data-view="generate">Generate Duties</button>
            <button class="nav-item" data-view="import">Import Data</button>
            <button class="nav-item" data-view="settings">Settings</button>
        </nav>
        <button id="logout-btn" class="nav-item nav-item-logout">Log Out</button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2 id="view-title">Dashboard</h2>
        </header>
        <div id="view-container" class="view-container">
            <!-- Views are rendered here by app.js -->
        </div>
    </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/api.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/faculty.js"></script>
<script src="js/views/classrooms.js"></script>
<script src="js/views/exams.js"></script>
<script src="js/views/generate.js"></script>
<script src="js/views/import.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
